name: reaper

# Post-run cleanup for the e2e / e2e-battery workflows. Fires via workflow_run AFTER
# either fully concludes, so it still runs even when the runner was terminated
# (manual Cancel / timeout-minutes) before the suite's own teardown finished.
on:
  workflow_run:
    workflows: [e2e, e2e-battery]
    types: [completed]

permissions:
  contents: read

# Same group as e2e (concurrency groups are repo-global) so the global reaper can
# never run while an e2e run holds live lm-acceptance-* infra — it queues behind.
concurrency:
  group: e2e-acceptance
  cancel-in-progress: false

jobs:
  reap:
    # A green run tore down its own infra; only clean up when it did not succeed.
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make venv

      - name: Reap leaked infra
        run: make clean-tags
